<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>電腦測驗大頭照擷取系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F0EFE9;color:#1C1C1A;overflow-y:auto}
.hdr{background:#fff;border-bottom:1px solid #DDDBD2;padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;height:60px}
.logo{font-size:15px;font-weight:600;color:#1C1C1A}.logo span{color:#0F6E56}

.ubtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid #DDDBD2;background:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:0.2s}
.ubtn:hover{background:#F5F4F0}
.active-green { background:#0F6E56 !important; color:#fff !important; border-color:#0F6E56 !important }
.inactive-white { background:#fff !important; color:#1C1C1A !important; border-color:#DDDBD2 !important }
.count-badge{font-size:13px; color:#0F6E56; font-weight:600; margin-left:-5px; margin-right:10px}

/* DPI 切換按鈕專用樣式 */
.dpi-btn-group { display: flex; gap: 4px; border: 1px solid #DDDBD2; padding: 3px; border-radius: 8px; background: #F5F4F0; margin-right: 10px; }
.dpi-btn { padding: 5px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s; color: #666; background: transparent; }
.dpi-btn.active { background: #0F6E56; color: #fff; box-shadow: 0 2px 6px rgba(15,110,86,0.2); }

/* 右側製作標記樣式 */
.maker-tag { font-size: 12px; color: #888; font-weight: 500; letter-spacing: 0.5px; white-space: nowrap; }

.main-section{display:flex; height:calc(100vh - 60px); border-bottom:2px solid #0F6E56}
.left-editor{flex:1; overflow:auto; padding:40px; background:#E8E7E1; display:block; position:relative;}
#scrollContainer {position: relative; display: inline-block; text-align: left; margin: 0;}

.zoom-sticky-box {position: sticky; bottom: 20px; left: 20px; z-index: 150; width: fit-content; pointer-events: none; margin-top: 20px;}
.zoom-ctrl{display:flex; gap:5px; background:rgba(255,255,255,0.95); padding:8px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.15); border:1px solid #DDDBD2; pointer-events: auto;}
.zbtn{width:36px; height:36px; border-radius:6px; border:1px solid #DDDBD2; background:#fff; font-size:20px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center}
.zinfo{min-width:50px; text-align:center; line-height:36px; font-size:12px; font-weight:600}

.right-sidebar{width:300px; background:#fff; border-left:1px solid #DDDBD2; display:flex; flex-direction:column}
#regionList { flex:1; overflow-y:auto; padding:10px; background: #F9F9F7; scroll-behavior: smooth; }

.region-item { background:#fff; border:1px solid #DDDBD2; border-radius:8px; margin-bottom:10px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
.region-item-hdr { padding:6px 10px; display:flex; justify-content:space-between; align-items:center; background:#f0f0f0; border-bottom:1px solid #eee; font-size:11px; font-weight:bold; }
.region-thumb-wrap { width:100%; height:100px; background:#eee; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.region-thumb-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
.del-btn { cursor:pointer; color:#999; font-size:14px; padding: 2px 5px; }

.canvas-wrap{position:relative; display:inline-block; box-shadow:0 2px 25px rgba(0,0,0,0.15); cursor:crosshair; transform-origin: 0 0;}
#pdfCanvas{display:block}#overlayCanvas{position:absolute; top:0; left:0}

.work-section{padding:40px 20px; background:#1E1E2E; color:#fff; min-height:100vh; display:none}
.work-hdr{max-width:1600px; margin:0 auto 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:20px}
.prev-grid{max-width:1600px; margin:0 auto; display:grid; grid-template-columns: repeat(5, 1fr); gap:15px}
.pcard{background:#2B2B3D; border-radius:10px; overflow:hidden; border:1px solid #444; display:flex; flex-direction:column}
.pcard-img-wrap{width:100%; height:220px; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:5px}
.pcard img{max-width:100%; max-height:100%; object-fit:contain; border:1px solid #555}

.adj-box{padding:12px; text-align:center; font-size:12px}
.btn-group{display:flex; gap:5px; justify-content:center; margin:8px 0}
.rbtn{background:#3A3A4E; border:1px solid #555; color:#fff; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:11px}
.name-input{width:100%; background:#1e1e2e; border:1px solid #555; color:#fff; padding:6px; border-radius:4px; margin-top:8px; font-size:11px}
.btn-go{padding:12px 24px; border-radius:8px; border:none; font-weight:600; cursor:pointer}
.btn-go.green{background:#0F6E56; color:#fff}
.btn-go.dark{background:#fff; color:#1C1C1A}

.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:center; justify-content:center }
.modal-content { background:#fff; width:480px; padding:25px; border-radius:15px; color:#111; max-height: 90vh; overflow-y: auto; }
.modal-hint { font-size:12px; color:#666; line-height:1.5; margin: -5px 0 15px; }
.num-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 5px }
.num-item { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #eee; border-radius:6px; font-size:13px; cursor:pointer }
.section-divider { grid-column: 1 / span 4; height: 2px; background: #FF4D4F; margin: 5px 0 }
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">電腦測驗<span>大頭照擷取系統</span></div>
  <button class="ubtn" id="fileBtn">📁 上傳檔案</button>
  <span id="fileCount" class="count-badge"></span>
  <button class="ubtn inactive-white" id="csvBtn">📊 上傳名單</button>
  <span id="csvCount" class="count-badge"></span>
  <button class="ubtn inactive-white" id="manualBtn">🔢 手動選擇編號</button>
  <span id="manualCount" class="count-badge"></span>

  <div class="dpi-btn-group">
    <button type="button" class="dpi-btn" id="dpi300Btn" onclick="switchDpi(300)">300 DPI</button>
    <button type="button" class="dpi-btn active" id="dpi600Btn" onclick="switchDpi(600)">600 DPI</button>
  </div>

  <input type="file" id="mainFile" accept=".pdf,image/*" multiple style="display:none">
  <input type="file" id="csvFile" accept=".csv,.xls,.xlsx" style="display:none">

  <div style="flex:1; display:flex; align-items:center; justify-content:center">
    <div id="pgCtrl" style="display:none; align-items:center; gap:10px">
      <button class="ubtn" id="prevPg">◀</button>
      <span id="pgInfo">1 / 1</span>
      <button class="ubtn" id="nextPg">▶</button>
    </div>
  </div>

  <div class="maker-tag">高雄職訓製作 V3</div>
</div>

<div class="main-section">
  <div class="left-editor" id="editorParent">
    <div id="scrollContainer">
        <div class="canvas-wrap" id="canvasWrap" style="display:none">
          <canvas id="pdfCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
    </div>
    <div class="zoom-sticky-box">
        <div class="zoom-ctrl" id="zoomUI" style="display:none">
            <button class="zbtn" onclick="updateZoom(-0.1)">-</button>
            <div class="zinfo" id="zoomVal">100%</div>
            <button class="zbtn" onclick="updateZoom(0.1)">+</button>
            <button class="zbtn" onclick="updateZoom(0, true)" style="font-size:11px">重置</button>
        </div>
    </div>
  </div>

  <div class="right-sidebar">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #eee">框選清單 (即時預覽)</div>
    <div id="regionList"></div>
    <div style="padding:15px">
      <button class="btn-go green" id="btnExtract" style="width:100%" disabled>⚡ 執行擷取</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px"><h3>手動編號</h3><span style="cursor:pointer" onclick="toggleModal(false)">✕</span></div>
    <p class="modal-hint">勾選後會依「框選清單」順序自動套用；只保留有截圖的項目，不需要的號碼可取消勾選。</p>
    <div style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:15px; display:flex; gap:10px; align-items:center">
      <span>最大：</span><input type="number" id="maxNumInput" value="60" style="width:60px">
      <button onclick="setAllCheck(true)">全選</button><button onclick="setAllCheck(false)">全不選</button>
    </div>
    <div class="num-grid" id="numGrid"></div>
    <div style="margin-top:20px"><button class="btn-go green" style="width:100%" onclick="confirmManualNums()">確認套用</button></div>
  </div>
</div>

<div class="work-section" id="workSection">
  <div class="work-hdr">
    <h2>預覽與微調 (嚴格鎖定尺寸: 413 x 531)</h2>
    <button class="btn-go dark" id="btnDL" disabled>⬇ 下載全部 (.zip)</button>
  </div>
  <div class="prev-grid" id="prevGrid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script>
(function() {
  const TARGET_W = 413, TARGET_H = 531;
  const COLORS = ['#E24B4A', '#2E7D32', '#1565C0', '#F9A825', '#6A1B9A', '#00838F', '#AD1457'];

  var pdfDoc=null, isImageMode=false, totalPages=1, currentZoom=1.0;
  var currPageNum=1, pdfCache={}, csvRows=[], regions=[], finalImages=[], manualNums=[];
  var namingSource = 'manual', currentSelectedDpi = 600;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdfCanvas=document.getElementById('pdfCanvas'), ctx=pdfCanvas.getContext('2d');
  const overlayCanvas=document.getElementById('overlayCanvas'), ovCtx=overlayCanvas.getContext('2d');
  const canvasWrap=document.getElementById('canvasWrap');
  const scrollContainer=document.getElementById('scrollContainer');

  window.switchDpi = function(dpi) {
    currentSelectedDpi = dpi;
    document.getElementById('dpi300Btn').className = (dpi === 300) ? 'dpi-btn active' : 'dpi-btn';
    document.getElementById('dpi600Btn').className = (dpi === 600) ? 'dpi-btn active' : 'dpi-btn';

    if(finalImages.length > 0) {
      document.getElementById('btnExtract').click();
    }
  };

  function padNumber(num) {
    return num.toString().padStart(3, '0');
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function getCheckedManualNums() {
    return Array.from(document.querySelectorAll('#numGrid input:checked')).map(i => i.value);
  }

  function setNamingSource(src) {
    namingSource = src;
    document.getElementById('csvBtn').className = (src === 'csv') ? 'ubtn active-green' : 'ubtn inactive-white';
    document.getElementById('manualBtn').className = (src === 'manual') ? 'ubtn active-green' : 'ubtn inactive-white';
  }

  function getCsvNameByIndex(index) {
    const row = csvRows[index];
    if (!row) return '';
    const firstValue = Object.values(row).find(v => String(v ?? '').trim() !== '');
    return firstValue ? String(firstValue).trim() : '';
  }

  function getNextAvailableNumber(usedNames) {
    let num = 1;
    while (usedNames.has(padNumber(num))) num++;
    return padNumber(num);
  }

  function resolveRegionDisplayNames() {
    const usedNames = new Set();
    return regions.map((_, index) => {
      let name = '';
      if (namingSource === 'manual') name = manualNums[index] || '';
      else if (namingSource === 'csv') name = getCsvNameByIndex(index);

      name = String(name || '').trim();
      if (!name || usedNames.has(name)) name = getNextAvailableNumber(usedNames);
      usedNames.add(name);
      return name;
    });
  }

  function syncFinalNamesFromRegions(force = false) {
    finalImages.forEach((img, index) => {
      if (!img || !regions[index]) return;
      if (force || !img.manualEdited) {
        img.name = regions[index].displayName;
        img.manualEdited = false;
      }
    });
  }

  function applyManualSelection(forceFinalNames = false) {
    manualNums = getCheckedManualNums();
    document.getElementById('manualCount').textContent = `(已選 ${manualNums.length} 筆)`;
    setNamingSource('manual');
    updateUI(forceFinalNames);
  }

  function generateNumGrid(max) {
    const grid = document.getElementById('numGrid'); grid.innerHTML = '';
    const selectedNums = new Set(manualNums.length ? manualNums : getCheckedManualNums());
    const defaultChecked = selectedNums.size === 0;
    for(let i=1; i<=max; i++) {
      let n = padNumber(i);
      const checked = (defaultChecked || selectedNums.has(n)) ? 'checked' : '';
      grid.innerHTML += `<label class="num-item"><input type="checkbox" value="${n}" ${checked}> ${n}</label>`;
      if (i % 16 === 0 && i !== max) grid.innerHTML += `<div class="section-divider"></div>`;
    }
  }

  document.getElementById('maxNumInput').oninput = function() {
    generateNumGrid(parseInt(this.value) || 1);
    applyManualSelection(true);
  };
  document.getElementById('numGrid').addEventListener('change', () => applyManualSelection(true));
  window.setAllCheck = (bool) => {
    document.querySelectorAll('#numGrid input').forEach(i => i.checked = bool);
    applyManualSelection(true);
  };

  window.toggleModal = (show) => document.getElementById('modal').style.display = show ? 'flex' : 'none';
  document.getElementById('manualBtn').onclick = () => toggleModal(true);
  window.confirmManualNums = () => {
    applyManualSelection(true);
    window.toggleModal(false);
  };
  generateNumGrid(60);
  applyManualSelection(false);

  document.getElementById('fileBtn').onclick=()=>document.getElementById('mainFile').click();
  document.getElementById('csvBtn').onclick=()=>document.getElementById('csvFile').click();

  document.getElementById('mainFile').onchange=async function(){
    const files = Array.from(this.files); if(files.length === 0) return;
    pdfCache = {}; regions = []; currPageNum = 1; currentZoom = 1.0;
    if(files[0].type === "application/pdf") { isImageMode = false; await loadPDF(files[0]); }
    else { isImageMode = true; await loadMultipleImages(files); }
    updateZoom(0, true);
  };

  document.getElementById('csvFile').onchange=function(){ if(this.files[0]) {
    var reader = new FileReader(); reader.onload=(e)=>{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        csvRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        document.getElementById('csvCount').textContent=`(共 ${csvRows.length} 筆)`;
        setNamingSource('csv'); updateUI(true);
    }; reader.readAsArrayBuffer(this.files[0]);
  }};

  window.updateZoom = (delta, reset=false) => {
    if(reset) currentZoom = 1.0; else currentZoom = Math.max(0.1, Math.min(4.0, currentZoom + delta));
    document.getElementById('zoomVal').textContent = Math.round(currentZoom * 100) + '%';
    canvasWrap.style.transform = `scale(${currentZoom})`;
    scrollContainer.style.width = (pdfCanvas.width * currentZoom) + 'px';
    scrollContainer.style.height = (pdfCanvas.height * currentZoom) + 'px';
  };

  var drawing=false, startX=0, startY=0;
  overlayCanvas.onmousedown=(e)=>{ if(!isLoaded())return; var p=getPos(e); startX=p.x; startY=p.y; drawing=true; };
  overlayCanvas.onmousemove=(e)=>{ if(!drawing)return; var p=getPos(e); drawOverlay({x:startX,y:startY,w:p.x-startX,h:p.y-startY}, regions.length); };
  overlayCanvas.onmouseup=(e)=>{
    if(!drawing)return; drawing=false;
    var p=getPos(e), rw=Math.abs(p.x-startX), rh=Math.abs(p.y-startY);
    if(rw<10||rh<10) return;
    let tempCanvas = document.createElement('canvas'); tempCanvas.width = rw; tempCanvas.height = rh;
    tempCanvas.getContext('2d').drawImage(pdfCanvas, Math.min(startX, p.x), Math.min(startY, p.y), rw, rh, 0, 0, rw, rh);
    regions.push({ page:currPageNum, cx: Math.min(startX, p.x)+rw/2, cy: Math.min(startY, p.y)+rh/2, w:rw, h:rh, angle:0, thumb: tempCanvas.toDataURL('image/jpeg', 0.5) });
    updateUI();
  };

  function isLoaded() { return isImageMode ? !!pdfCache[1] : !!pdfDoc; }
  async function loadPDF(file){ pdfDoc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise; totalPages = pdfDoc.numPages; showEditorUI(`(共 ${totalPages} 頁)`); await changePage(); }
  async function loadMultipleImages(files) {
    totalPages = files.length; showEditorUI(`(共 ${totalPages} 張圖片)`);
    for (let i = 0; i < files.length; i++) {
        const img = await new Promise(resolve => { const r = new FileReader(); r.onload=(e)=>{ const o=new Image(); o.onload=()=>resolve(o); o.src=e.target.result; }; r.readAsDataURL(files[i]); });
        const tmp = document.createElement('canvas'); tmp.width = img.width; tmp.height = img.height; tmp.getContext('2d').drawImage(img, 0, 0); pdfCache[i + 1] = tmp;
    }
    await changePage();
  }

  function showEditorUI(text) {
    document.getElementById('fileCount').textContent = text;
    document.getElementById('pgCtrl').style.display = totalPages > 1 ? 'flex' : 'none';
    document.getElementById('canvasWrap').style.display='inline-block';
    document.getElementById('zoomUI').style.display='flex';
  }

  async function changePage(){
    document.getElementById('pgInfo').textContent = `${currPageNum} / ${totalPages}`;
    if (isImageMode) { const src = pdfCache[currPageNum]; const displayScale = 800 / src.width; pdfCanvas.width = src.width * displayScale; pdfCanvas.height = src.height * displayScale; }
    else { var page = await pdfDoc.getPage(currPageNum); var vp = page.getViewport({scale:1.5}); pdfCanvas.width=vp.width; pdfCanvas.height=vp.height; await page.render({canvasContext:ctx, viewport:vp}).promise; }
    overlayCanvas.width = pdfCanvas.width; overlayCanvas.height = pdfCanvas.height;
    if(isImageMode) ctx.drawImage(pdfCache[currPageNum], 0, 0, pdfCanvas.width, pdfCanvas.height);
    updateZoom(0); drawOverlay();
  }

  function drawOverlay(rb, nextIdx){
    ovCtx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height);
    regions.forEach((r,i)=>{ if(r.page !== currPageNum) return; ovCtx.strokeStyle = COLORS[i % COLORS.length]; ovCtx.lineWidth = 3; ovCtx.strokeRect(r.cx - r.w/2, r.cy - r.h/2, r.w, r.h); });
    if(rb){ ovCtx.strokeStyle = COLORS[nextIdx % COLORS.length]; ovCtx.lineWidth = 2; ovCtx.setLineDash([5,5]); ovCtx.strokeRect(rb.x, rb.y, rb.w, rb.h); ovCtx.setLineDash([]); }
  }

  function updateUI(forceFinalNames = false){
    const displayNames = resolveRegionDisplayNames();
    regions.forEach((r, i) => {
        r.displayName = displayNames[i];
    });
    syncFinalNamesFromRegions(forceFinalNames);

    const list = document.getElementById('regionList');
    list.innerHTML = regions.map((r,i)=>`
      <div class="region-item">
        <div class="region-item-hdr" style="border-left:4px solid ${COLORS[i % COLORS.length]}">
            <span>P${r.page}: ${escapeHtml(r.displayName)}</span>
            <span class="del-btn" onclick="delRegion(${i})">✕</span>
        </div>
        <div class="region-thumb-wrap"><img src="${r.thumb}"></div>
      </div>`).join('');
    document.getElementById('btnExtract').disabled = regions.length === 0;
    drawOverlay();
    if (finalImages.length > 0 && document.getElementById('workSection').style.display === 'block') renderPrevList();
    setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
  }

  document.getElementById('btnExtract').onclick=async function(){
    finalImages=[];
    const exportScale = 6.0;

    for(let pg of [...new Set(regions.map(r=>r.page))]){
      if(!isImageMode && !pdfCache[pg]){
        let page = await pdfDoc.getPage(pg); let vp = page.getViewport({scale:exportScale});
        let tmp = document.createElement('canvas'); tmp.width=vp.width; tmp.height=vp.height;
        await page.render({canvasContext:tmp.getContext('2d'), viewport:vp}).promise; pdfCache[pg] = tmp;
      }
      const ratio = isImageMode ? (pdfCache[pg].width / pdfCanvas.width) : (exportScale / 1.5);
      regions.forEach((r,i)=>{ if(r.page===pg) renderSingleImage(i, pg, ratio); });
    }
    document.getElementById('workSection').style.display='block';
    renderPrevList();
    document.getElementById('workSection').scrollIntoView({behavior:'smooth'});
  };

  function renderSingleImage(idx, pg, ratio){
    let r = regions[idx], pdfCX = r.cx * ratio, pdfCY = r.cy * ratio, origW = r.w * ratio, origH = r.h * ratio;

    let final = document.createElement('canvas'); final.width = TARGET_W; final.height = TARGET_H;
    let fCtx = final.getContext('2d'); fCtx.fillStyle = "#FFFFFF"; fCtx.fillRect(0, 0, TARGET_W, TARGET_H);
    fCtx.save(); fCtx.translate(TARGET_W / 2, TARGET_H / 2); fCtx.rotate(r.angle * Math.PI / 180);
    fCtx.drawImage(pdfCache[pg], pdfCX - origW/2, pdfCY - origH/2, origW, origH, -TARGET_W/2, -TARGET_H/2, TARGET_W, TARGET_H);
    fCtx.restore();

    let previousImage = finalImages[idx];
    let lastName = (previousImage && previousImage.manualEdited) ? previousImage.name : r.displayName;
    finalImages[idx] = { canvas: final, name: lastName, manualEdited: previousImage ? previousImage.manualEdited : false };
  }

  function renderPrevList(){
    const g = document.getElementById('prevGrid'); g.innerHTML = '';
    finalImages.forEach((img, i)=>{
      let d = document.createElement('div'); d.className = 'pcard';
      d.innerHTML = `<div style="height:4px; background:${COLORS[i % COLORS.length]}"></div>
        <div class="pcard-img-wrap"><img id="prevImg_${i}" src="${img.canvas.toDataURL('image/jpeg', 0.8)}"></div>
        <div class="adj-box">
          <div style="display:flex; justify-content:space-between; margin-bottom:5px"><b>#${i+1}</b><span id="degLabel_${i}">旋轉: ${regions[i].angle}°</span></div>
          <div class="btn-group"><button class="rbtn" onclick="updateRot(${i},-1)">-1°</button><button class="rbtn" onclick="updateRot(${i},1)">+1°</button></div>
          <input type="range" min="-15" max="15" value="${regions[i].angle}" oninput="updateRot(${i}, parseInt(this.value), false, true)" style="width:100%">
          <input type="text" class="name-input" value="${escapeHtml(img.name)}" oninput="syncName(${i}, this.value)" placeholder="請輸入檔名">
        </div>`;
      g.appendChild(d);
    });
    document.getElementById('btnDL').disabled = false;
  }

  window.syncName = (idx, val) => {
    finalImages[idx].name = val;
    finalImages[idx].manualEdited = true;
  };

  window.updateRot = (idx, val, reset=false, fromSlider=false) => {
    regions[idx].angle = fromSlider ? val : regions[idx].angle + val;
    const ratio = isImageMode ? (pdfCache[regions[idx].page].width / pdfCanvas.width) : (6.0 / 1.5);
    renderSingleImage(idx, regions[idx].page, ratio);
    document.getElementById(`prevImg_${idx}`).src = finalImages[idx].canvas.toDataURL('image/jpeg', 0.8);
    document.getElementById(`degLabel_${idx}`).textContent = `旋轉: ${regions[idx].angle}°`;
  };

  function getDpiJpeg(canvas, dpi) {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.95), base64 = dataUrl.split(',')[1], raw = atob(base64), uint8 = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) uint8[i] = raw.charCodeAt(i);

    const dpiH = Math.floor(dpi / 256);
    const dpiL = dpi % 256;

    const jfif = new Uint8Array([0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0x00, 0x01, 0x01, 0x01, dpiH, dpiL, dpiH, dpiL, 0x00, 0x00]);
    let start = (uint8[2] === 0xFF && uint8[3] === 0xE0) ? 2 + (uint8[4] * 256 + uint8[5]) + 2 : 2;
    const finalBlob = new Uint8Array(2 + jfif.length + uint8.length - start);
    finalBlob.set([0xFF, 0xD8], 0); finalBlob.set(jfif, 2); finalBlob.set(uint8.slice(start), 2 + jfif.length); return finalBlob;
  }

  document.getElementById('btnDL').onclick=()=>{
    var zip=new JSZip();
    const usedZipNames = new Set();
    finalImages.forEach(img => {
      let safeName = (img.name || "未命名").replace(/[\\/:*?"<>|]/g,'');
      safeName = safeName.trim() || "未命名";
      const baseName = safeName;
      let seq = 2;
      while (usedZipNames.has(safeName)) safeName = `${baseName}_${seq++}`;
      usedZipNames.add(safeName);
      zip.file(safeName + ".jpg", getDpiJpeg(img.canvas, currentSelectedDpi));
    });
    zip.generateAsync({type:'blob'}).then(blob=>saveAs(blob, `學員照片_${currentSelectedDpi}dpi.zip`));
  };

  function getPos(e){ var r=overlayCanvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / currentZoom, y: (e.clientY - r.top) / currentZoom }; }
  document.getElementById('prevPg').onclick=()=>{ if(currPageNum>1){ currPageNum--; changePage(); }};
  document.getElementById('nextPg').onclick=()=>{ if(currPageNum<totalPages){ currPageNum++; changePage(); }};
  window.delRegion = (idx) => {
    regions.splice(idx, 1);
    finalImages.splice(idx, 1);
    updateUI(true);
  };
})();
</script>
</body>
</html>
