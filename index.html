<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦測驗大頭照擷取系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F7F5;
  --panel:#FFFFFF;
  --panel-soft:#F8FAF8;
  --ink:#1D2521;
  --muted:#66706B;
  --line:#DDE4DE;
  --line-strong:#BAC8BF;
  --primary:#0F6E56;
  --primary-weak:#E5F4EF;
  --amber:#C77A1B;
  --red:#D84E45;
  --charcoal:#202725;
  --shadow:0 18px 40px rgba(36,39,34,0.10);
}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-y:auto}
button,input{font:inherit}
.hdr{height:72px;background:rgba(255,255,255,0.94);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(420px,1fr);align-items:center;gap:18px;padding:12px 18px;position:sticky;top:0;z-index:100;backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;min-width:172px;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
.logo::before{content:'測';width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 20px rgba(15,110,86,0.24)}
.logo span{color:var(--primary)}
.command-bar{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.ubtn{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.ubtn:hover{background:var(--panel-soft);border-color:var(--line-strong);transform:translateY(-1px)}
.ubtn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.active-green{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.inactive-white{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.count-badge{font-size:12px;color:var(--primary);font-weight:800;margin-left:-3px;margin-right:4px;white-space:nowrap}
.dpi-btn-group{height:36px;display:flex;align-items:center;gap:3px;border:1px solid var(--line);padding:3px;border-radius:8px;background:#EEF2EF}
.dpi-btn{height:28px;padding:0 12px;border-radius:6px;border:none;font-size:12px;font-weight:800;cursor:pointer;transition:.16s;color:#6D675E;background:transparent}
.dpi-btn.active{background:var(--charcoal);color:#fff;box-shadow:0 6px 14px rgba(35,37,34,0.18)}
#pgCtrl{align-items:center;gap:8px;background:var(--panel-soft);border:1px solid var(--line);border-radius:8px;padding:4px}
#pgCtrl .ubtn{width:34px;padding:0;justify-content:center}
#pgInfo{font-size:13px;font-weight:800;color:var(--muted);min-width:56px;text-align:center}
.main-section{height:calc(100vh - 72px);display:grid;grid-template-columns:minmax(0,1fr) 336px;border-bottom:1px solid var(--line);overflow:hidden;min-height:0}
.left-editor{overflow:auto;padding:18px;background:#E7EEEA;display:flex;flex-direction:column;position:relative;min-height:0}
.workspace-top{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.workspace-title{display:flex;align-items:center;gap:10px}
.workspace-title h2{font-size:16px;line-height:1;font-weight:850}
.status-dot{width:10px;height:10px;border-radius:999px;background:var(--amber);box-shadow:0 0 0 4px rgba(185,108,40,0.14)}
.spec-chip{border:1px solid var(--line);background:rgba(255,255,255,0.58);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.workspace-surface{flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:#F5F8F6;box-shadow:var(--shadow);overflow:auto;padding:26px}
#scrollContainer{position:relative;display:inline-block;text-align:left;margin:0}
.zoom-sticky-box{position:sticky;bottom:18px;left:0;z-index:150;width:fit-content;pointer-events:none;margin-top:18px}
.zoom-ctrl{display:flex;gap:5px;background:rgba(255,255,255,0.96);padding:6px;border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line);pointer-events:auto}
.zbtn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.zbtn:hover{border-color:var(--primary);color:var(--primary)}
.zinfo{min-width:52px;text-align:center;line-height:34px;font-size:12px;font-weight:850;color:var(--muted)}
.right-sidebar{width:auto;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.sidebar-head{height:64px;flex:0 0 64px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sidebar-head h3{font-size:14px;font-weight:850}
.sidebar-tag{font-size:11px;font-weight:800;color:var(--primary);background:var(--primary-weak);border-radius:999px;padding:4px 8px}
#regionList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px;background:var(--panel-soft);scroll-behavior:smooth;overscroll-behavior:contain}
.region-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.region-item-hdr{padding:7px 10px;display:flex;justify-content:space-between;align-items:center;background:#F0F4F1;border-bottom:1px solid var(--line);font-size:11px;font-weight:850}
.region-thumb-wrap{width:100%;height:104px;background:#E5ECE8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.region-thumb-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.del-btn{cursor:pointer;color:#8A8173;font-size:14px;padding:2px 5px}
.del-btn:hover{color:var(--red)}
.sidebar-action{flex:0 0 auto;padding:14px 16px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px}
.sidebar-action #btnExtract{flex:1;min-width:0}
.canvas-wrap{position:relative;display:inline-block;box-shadow:0 16px 38px rgba(34,36,31,0.18);cursor:crosshair;transform-origin:0 0;background:#fff}
#pdfCanvas{display:block}#overlayCanvas{position:absolute;top:0;left:0}
.work-section{padding:22px;background:#202624;color:#fff;min-height:100vh;display:none}
.work-hdr{max-width:1600px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.12);padding-bottom:16px;gap:12px}
.work-hdr h2{font-size:17px;font-weight:850}
.work-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.work-count{font-size:12px;color:#DCD4C4;font-weight:850}
.prev-grid{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pcard{background:#28302D;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;min-width:0;cursor:pointer;transition:border-color .16s,background .16s}
.pcard.active{border-color:#E0A84D;background:#303A34}
.pcard-img-wrap{width:100%;height:190px;background:#121210;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.pcard img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid rgba(255,255,255,0.16)}
.pcard-info{min-width:0;display:flex;flex-direction:column;gap:8px;padding:12px 12px 0}
.pcard-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard-title{font-size:12px;font-weight:850;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-note{font-size:11px;color:#CFC8BB}
.adj-box{padding:12px;text-align:left;font-size:12px}
.control-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.btn-group{display:flex;gap:6px;justify-content:center;margin:8px 0}
.rbtn{background:#39423E;border:1px solid rgba(255,255,255,0.14);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:800}
.rbtn:hover{border-color:#D7B37A;color:#FFE8BF}
.control-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.control-label{width:38px;color:#DCD4C4;text-align:left;white-space:nowrap}
.control-row input[type="range"]{flex:1;accent-color:var(--primary);cursor:pointer}
.control-value{width:46px;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.name-input{width:100%;background:#1C1B18;border:1px solid rgba(255,255,255,0.16);color:#fff;padding:7px;border-radius:6px;margin-top:8px;font-size:12px}
.btn-go{padding:12px 18px;border-radius:8px;border:none;font-weight:850;cursor:pointer}
.btn-go.green{background:var(--primary);color:#fff;width:100%;box-shadow:0 12px 24px rgba(15,110,86,0.22)}
.btn-go.green:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-go.dark{background:#fff;color:var(--ink)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(29,37,33,0.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-content{background:var(--panel);width:480px;padding:22px;border-radius:8px;color:var(--ink);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:-5px 0 15px}
.num-toolbar{background:var(--panel-soft);padding:12px;border-radius:8px;margin-bottom:15px;display:flex;gap:10px;align-items:center}
.num-toolbar input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px}
.num-toolbar button{height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;cursor:pointer}
.num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:5px}
.num-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer;background:#fff}
.section-divider{grid-column:1 / span 4;height:2px;background:var(--red);margin:5px 0}
@media (max-width:980px){
  .hdr{height:auto;grid-template-columns:1fr;padding:12px}
  .command-bar{justify-content:flex-start}
  .main-section{height:auto;min-height:calc(100vh - 72px);grid-template-columns:1fr}
  .right-sidebar{border-left:none;border-top:1px solid var(--line);height:420px;min-height:0}
  .workspace-surface{padding:16px}
  .prev-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  body{overflow-x:hidden}
  .logo{min-width:0}
  .command-bar{display:grid;grid-template-columns:1fr;width:100%;max-width:100%;gap:8px}
  .command-bar .ubtn{width:100%;justify-content:center}
  .count-badge{display:none}
  .dpi-btn-group{width:max-content;max-width:100%}
  .workspace-top{height:auto;display:grid;grid-template-columns:1fr;gap:10px}
  .spec-chip{justify-self:start;max-width:100%;white-space:normal}
  .left-editor{padding:16px}
  .sidebar-action{align-items:stretch;flex-wrap:wrap}
  #pgCtrl{width:100%;justify-content:center}
  .prev-grid{grid-template-columns:1fr}
  .work-hdr{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">電腦測驗<span>大頭照擷取系統</span></div>
  <div class="command-bar">
    <button class="ubtn" id="fileBtn">📁 上傳檔案</button>
    <span id="fileCount" class="count-badge"></span>
    <button class="ubtn inactive-white" id="csvBtn">📊 上傳名單</button>
    <span id="csvCount" class="count-badge"></span>
    <button class="ubtn inactive-white" id="manualBtn">🔢 手動編號</button>
    <span id="manualCount" class="count-badge"></span>
    <div class="dpi-btn-group">
      <button type="button" class="dpi-btn" id="dpi300Btn" onclick="switchDpi(300)">300 DPI</button>
      <button type="button" class="dpi-btn active" id="dpi600Btn" onclick="switchDpi(600)">600 DPI</button>
    </div>
  </div>

  <input type="file" id="mainFile" accept=".pdf,image/*" multiple style="display:none">
  <input type="file" id="csvFile" accept=".csv,.xls,.xlsx" style="display:none">

</div>

<div class="main-section">
  <div class="left-editor" id="editorParent">
    <div class="workspace-top">
      <div class="workspace-title">
        <span class="status-dot"></span>
        <h2>裁切工作區</h2>
      </div>
      <div class="spec-chip">JPG / 白底 / DPI 可切換</div>
    </div>
    <div class="workspace-surface">
      <div id="scrollContainer">
        <div class="canvas-wrap" id="canvasWrap" style="display:none">
          <canvas id="pdfCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
      </div>
    </div>
    <div class="zoom-sticky-box">
        <div class="zoom-ctrl" id="zoomUI" style="display:none">
            <button class="zbtn" onclick="updateZoom(-0.1)">-</button>
            <div class="zinfo" id="zoomVal">100%</div>
            <button class="zbtn" onclick="updateZoom(0.1)">+</button>
            <button class="zbtn" onclick="updateZoom(0, true)" style="font-size:11px">重置</button>
        </div>
    </div>
  </div>

  <div class="right-sidebar">
    <div class="sidebar-head">
      <h3>框選清單</h3>
      <span class="sidebar-tag">即時預覽</span>
    </div>
    <div id="regionList"></div>
    <div class="sidebar-action">
      <div id="pgCtrl" style="display:none">
        <button class="ubtn" id="prevPg" type="button" title="上一頁（←）">◀</button>
        <span id="pgInfo">1 / 1</span>
        <button class="ubtn" id="nextPg" type="button" title="下一頁（→）">▶</button>
      </div>
      <button class="btn-go green" id="btnExtract" disabled>⚡ 執行擷取</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px"><h3>手動編號</h3><span style="cursor:pointer" onclick="toggleModal(false)">✕</span></div>
    <p class="modal-hint">勾選後會依「框選清單」順序自動套用；只保留有截圖的項目，不需要的號碼可取消勾選。</p>
    <div class="num-toolbar">
      <span>最大：</span><input type="number" id="maxNumInput" value="60" style="width:60px">
      <button onclick="setAllCheck(true)">全選</button><button onclick="setAllCheck(false)">全不選</button>
    </div>
    <div class="num-grid" id="numGrid"></div>
    <div style="margin-top:20px"><button class="btn-go green" style="width:100%" onclick="confirmManualNums()">確認套用</button></div>
  </div>
</div>

<div class="work-section" id="workSection">
  <div class="work-hdr">
    <div class="work-title">
      <h2>預覽與微調 (413 × 531)</h2>
      <span class="work-count" id="reviewCount">0 張</span>
    </div>
    <button class="btn-go dark" id="btnDL" disabled>⬇ 下載全部 (.zip)</button>
  </div>
  <div class="prev-grid" id="prevGrid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script>
(function() {
  const TARGET_W = 413, TARGET_H = 531;
  const COLORS = ['#E24B4A', '#2E7D32', '#1565C0', '#F9A825', '#6A1B9A', '#00838F', '#AD1457'];

  var pdfDoc=null, isImageMode=false, totalPages=1, currentZoom=1.0;
  var currPageNum=1, pdfCache={}, csvRows=[], finalImages=[], manualNums=[], regions=[];
  var activeResultIndex = 0;
  var namingSource = 'manual', currentSelectedDpi = 600;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdfCanvas=document.getElementById('pdfCanvas'), ctx=pdfCanvas.getContext('2d');
  const overlayCanvas=document.getElementById('overlayCanvas'), ovCtx=overlayCanvas.getContext('2d');
  const canvasWrap=document.getElementById('canvasWrap');
  const scrollContainer=document.getElementById('scrollContainer');

  window.switchDpi = function(dpi) {
    currentSelectedDpi = dpi;
    document.getElementById('dpi300Btn').className = (dpi === 300) ? 'dpi-btn active' : 'dpi-btn';
    document.getElementById('dpi600Btn').className = (dpi === 600) ? 'dpi-btn active' : 'dpi-btn';

    if(finalImages.length > 0) {
      document.getElementById('btnExtract').click();
    }
  };

  function padNumber(num) {
    return num.toString().padStart(3, '0');
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function getCheckedManualNums() {
    return Array.from(document.querySelectorAll('#numGrid input:checked')).map(i => i.value);
  }

  function setNamingSource(src) {
    namingSource = src;
    document.getElementById('csvBtn').className = (src === 'csv') ? 'ubtn active-green' : 'ubtn inactive-white';
    document.getElementById('manualBtn').className = (src === 'manual') ? 'ubtn active-green' : 'ubtn inactive-white';
  }

  function getCsvNameByIndex(index) {
    const row = csvRows[index];
    if (!row) return '';
    const firstValue = Object.values(row).find(v => String(v ?? '').trim() !== '');
    return firstValue ? String(firstValue).trim() : '';
  }

  function getNextAvailableNumber(usedNames) {
    let num = 1;
    while (usedNames.has(padNumber(num))) num++;
    return padNumber(num);
  }

  function resolveRegionDisplayNames() {
    const usedNames = new Set();
    return regions.map((_, index) => {
      let name = '';
      if (namingSource === 'manual') name = manualNums[index] || '';
      else if (namingSource === 'csv') name = getCsvNameByIndex(index);

      name = String(name || '').trim();
      if (!name || usedNames.has(name)) name = getNextAvailableNumber(usedNames);
      usedNames.add(name);
      return name;
    });
  }

  function syncFinalNamesFromRegions(force = false) {
    finalImages.forEach((img, index) => {
      if (!img || !regions[index]) return;
      if (force || !img.manualEdited) {
        img.name = regions[index].displayName;
        img.manualEdited = false;
      }
    });
  }

  function applyManualSelection(forceFinalNames = false) {
    manualNums = getCheckedManualNums();
    document.getElementById('manualCount').textContent = `(已選 ${manualNums.length} 筆)`;
    setNamingSource('manual');
    updateUI(forceFinalNames);
  }

  function generateNumGrid(max) {
    const grid = document.getElementById('numGrid'); grid.innerHTML = '';
    const selectedNums = new Set(manualNums.length ? manualNums : getCheckedManualNums());
    const defaultChecked = selectedNums.size === 0;
    for(let i=1; i<=max; i++) {
      let n = padNumber(i);
      const checked = (defaultChecked || selectedNums.has(n)) ? 'checked' : '';
      grid.innerHTML += `<label class="num-item"><input type="checkbox" value="${n}" ${checked}> ${n}</label>`;
      if (i % 16 === 0 && i !== max) grid.innerHTML += `<div class="section-divider"></div>`;
    }
  }

  document.getElementById('maxNumInput').oninput = function() {
    generateNumGrid(parseInt(this.value) || 1);
    applyManualSelection(true);
  };
  document.getElementById('numGrid').addEventListener('change', () => applyManualSelection(true));
  window.setAllCheck = (bool) => {
    document.querySelectorAll('#numGrid input').forEach(i => i.checked = bool);
    applyManualSelection(true);
  };

  window.toggleModal = (show) => document.getElementById('modal').style.display = show ? 'flex' : 'none';
  document.getElementById('manualBtn').onclick = () => toggleModal(true);
  window.confirmManualNums = () => {
    applyManualSelection(true);
    window.toggleModal(false);
  };
  generateNumGrid(60);
  applyManualSelection(false);

  document.getElementById('fileBtn').onclick=()=>document.getElementById('mainFile').click();
  document.getElementById('csvBtn').onclick=()=>document.getElementById('csvFile').click();

  document.getElementById('mainFile').onchange=async function(){
    const files = Array.from(this.files); if(files.length === 0) return;
    pdfCache = {}; regions = []; finalImages = []; activeResultIndex = 0; currPageNum = 1; currentZoom = 1.0;
    document.getElementById('workSection').style.display = 'none';
    document.getElementById('btnDL').disabled = true;
    if(files[0].type === "application/pdf") { isImageMode = false; await loadPDF(files[0]); }
    else { isImageMode = true; await loadMultipleImages(files); }
    updateZoom(0, true);
  };

  document.getElementById('csvFile').onchange=function(){ if(this.files[0]) {
    var reader = new FileReader(); reader.onload=(e)=>{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        csvRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        document.getElementById('csvCount').textContent=`(共 ${csvRows.length} 筆)`;
        setNamingSource('csv'); updateUI(true);
    }; reader.readAsArrayBuffer(this.files[0]);
  }};

  window.updateZoom = (delta, reset=false) => {
    if(reset) currentZoom = 1.0; else currentZoom = Math.max(0.1, Math.min(4.0, currentZoom + delta));
    document.getElementById('zoomVal').textContent = Math.round(currentZoom * 100) + '%';
    canvasWrap.style.transform = `scale(${currentZoom})`;
    scrollContainer.style.width = (pdfCanvas.width * currentZoom) + 'px';
    scrollContainer.style.height = (pdfCanvas.height * currentZoom) + 'px';
  };

  var drawing=false, startX=0, startY=0;
  overlayCanvas.onmousedown=(e)=>{ if(!isLoaded())return; var p=getPos(e); startX=p.x; startY=p.y; drawing=true; };
  overlayCanvas.onmousemove=(e)=>{ if(!drawing)return; var p=getPos(e); drawOverlay({x:startX,y:startY,w:p.x-startX,h:p.y-startY}, regions.length); };
  overlayCanvas.onmouseup=(e)=>{
    if(!drawing)return; drawing=false;
    var p=getPos(e), rw=Math.abs(p.x-startX), rh=Math.abs(p.y-startY);
    if(rw<10||rh<10) return;
    let tempCanvas = document.createElement('canvas'); tempCanvas.width = rw; tempCanvas.height = rh;
    tempCanvas.getContext('2d').drawImage(pdfCanvas, Math.min(startX, p.x), Math.min(startY, p.y), rw, rh, 0, 0, rw, rh);
    regions.push({ page:currPageNum, cx: Math.min(startX, p.x)+rw/2, cy: Math.min(startY, p.y)+rh/2, w:rw, h:rh, angle:0, scale:100, thumb: tempCanvas.toDataURL('image/jpeg', 0.5) });
    updateUI();
  };

  function isLoaded() { return isImageMode ? !!pdfCache[1] : !!pdfDoc; }
  async function loadPDF(file){ pdfDoc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise; totalPages = pdfDoc.numPages; showEditorUI(`(共 ${totalPages} 頁)`); await changePage(); }
  async function loadMultipleImages(files) {
    totalPages = files.length; showEditorUI(`(共 ${totalPages} 張圖片)`);
    for (let i = 0; i < files.length; i++) {
        const img = await new Promise(resolve => { const r = new FileReader(); r.onload=(e)=>{ const o=new Image(); o.onload=()=>resolve(o); o.src=e.target.result; }; r.readAsDataURL(files[i]); });
        const tmp = document.createElement('canvas'); tmp.width = img.width; tmp.height = img.height; tmp.getContext('2d').drawImage(img, 0, 0); pdfCache[i + 1] = tmp;
    }
    await changePage();
  }

  function showEditorUI(text) {
    document.getElementById('fileCount').textContent = text;
    document.getElementById('pgCtrl').style.display = totalPages > 1 ? 'flex' : 'none';
    document.getElementById('canvasWrap').style.display='inline-block';
    document.getElementById('zoomUI').style.display='flex';
    updatePageControls();
  }

  async function changePage(){
    document.getElementById('pgInfo').textContent = `${currPageNum} / ${totalPages}`;
    if (isImageMode) { const src = pdfCache[currPageNum]; const displayScale = 800 / src.width; pdfCanvas.width = src.width * displayScale; pdfCanvas.height = src.height * displayScale; }
    else { var page = await pdfDoc.getPage(currPageNum); var vp = page.getViewport({scale:1.5}); pdfCanvas.width=vp.width; pdfCanvas.height=vp.height; await page.render({canvasContext:ctx, viewport:vp}).promise; }
    overlayCanvas.width = pdfCanvas.width; overlayCanvas.height = pdfCanvas.height;
    if(isImageMode) ctx.drawImage(pdfCache[currPageNum], 0, 0, pdfCanvas.width, pdfCanvas.height);
    updateZoom(0); drawOverlay();
    updatePageControls();
  }

  function updatePageControls(){
    document.getElementById('pgInfo').textContent = `${currPageNum} / ${totalPages}`;
    document.getElementById('prevPg').disabled = currPageNum <= 1;
    document.getElementById('nextPg').disabled = currPageNum >= totalPages;
  }

  function goPage(delta){
    if(!isLoaded() || totalPages <= 1) return;
    const nextPage = Math.max(1, Math.min(totalPages, currPageNum + delta));
    if(nextPage === currPageNum) return;
    currPageNum = nextPage;
    changePage();
  }

  function drawOverlay(rb, nextIdx){
    ovCtx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height);
    regions.forEach((r,i)=>{ if(r.page !== currPageNum) return; ovCtx.strokeStyle = COLORS[i % COLORS.length]; ovCtx.lineWidth = 3; ovCtx.strokeRect(r.cx - r.w/2, r.cy - r.h/2, r.w, r.h); });
    if(rb){ ovCtx.strokeStyle = COLORS[nextIdx % COLORS.length]; ovCtx.lineWidth = 2; ovCtx.setLineDash([5,5]); ovCtx.strokeRect(rb.x, rb.y, rb.w, rb.h); ovCtx.setLineDash([]); }
  }

  function updateUI(forceFinalNames = false){
    const displayNames = resolveRegionDisplayNames();
    regions.forEach((r, i) => {
        r.displayName = displayNames[i];
    });
    syncFinalNamesFromRegions(forceFinalNames);

    const list = document.getElementById('regionList');
    list.innerHTML = regions.map((r,i)=>`
      <div class="region-item">
        <div class="region-item-hdr" style="border-left:4px solid ${COLORS[i % COLORS.length]}">
            <span>P${r.page}: ${escapeHtml(r.displayName)}</span>
            <span class="del-btn" onclick="delRegion(${i})">✕</span>
        </div>
        <div class="region-thumb-wrap"><img src="${r.thumb}"></div>
      </div>`).join('');
    document.getElementById('btnExtract').disabled = regions.length === 0;
    drawOverlay();
    if (document.getElementById('workSection').style.display === 'block') renderPrevList();
    setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
  }

  document.getElementById('btnExtract').onclick=async function(){
    finalImages=[];
    const exportScale = 6.0;

    for(let pg of [...new Set(regions.map(r=>r.page))]){
      if(!isImageMode && !pdfCache[pg]){
        let page = await pdfDoc.getPage(pg); let vp = page.getViewport({scale:exportScale});
        let tmp = document.createElement('canvas'); tmp.width=vp.width; tmp.height=vp.height;
        await page.render({canvasContext:tmp.getContext('2d'), viewport:vp}).promise; pdfCache[pg] = tmp;
      }
      const ratio = isImageMode ? (pdfCache[pg].width / pdfCanvas.width) : (exportScale / 1.5);
      regions.forEach((r,i)=>{ if(r.page===pg) renderSingleImage(i, pg, ratio); });
    }
    document.getElementById('workSection').style.display='block';
    renderPrevList();
    document.getElementById('workSection').scrollIntoView({behavior:'smooth'});
  };

  function renderSingleImage(idx, pg, ratio){
    let r = regions[idx], pdfCX = r.cx * ratio, pdfCY = r.cy * ratio, origW = r.w * ratio, origH = r.h * ratio;
    let scale = Math.max(50, Math.min(200, parseInt(r.scale || 100)));
    r.scale = scale;
    let drawW = TARGET_W * (scale / 100), drawH = TARGET_H * (scale / 100);

    let final = document.createElement('canvas'); final.width = TARGET_W; final.height = TARGET_H;
    let fCtx = final.getContext('2d'); fCtx.fillStyle = "#FFFFFF"; fCtx.fillRect(0, 0, TARGET_W, TARGET_H);
    fCtx.save(); fCtx.translate(TARGET_W / 2, TARGET_H / 2); fCtx.rotate(r.angle * Math.PI / 180);
    fCtx.drawImage(pdfCache[pg], pdfCX - origW/2, pdfCY - origH/2, origW, origH, -drawW/2, -drawH/2, drawW, drawH);
    fCtx.restore();

    let previousImage = finalImages[idx];
    let lastName = (previousImage && previousImage.manualEdited) ? previousImage.name : r.displayName;
    finalImages[idx] = { canvas: final, name: lastName, manualEdited: previousImage ? previousImage.manualEdited : false };
  }

  function renderPrevList(){
    if (activeResultIndex >= finalImages.length) activeResultIndex = Math.max(0, finalImages.length - 1);
    const g = document.getElementById('prevGrid'); g.innerHTML = '';
    const count = document.getElementById('reviewCount');
    if (count) count.textContent = `${finalImages.length} 張`;
    if (finalImages.length === 0) {
      document.getElementById('btnDL').disabled = true;
      return;
    }
    finalImages.forEach((img, i)=>{
      const region = regions[i] || {};
      let d = document.createElement('div'); d.className = 'pcard';
      if (i === activeResultIndex) d.classList.add('active');
      d.onclick = () => setActiveResult(i);
      d.innerHTML = `
        <div class="pcard-img-wrap"><img id="prevImg_${i}" src="${img.canvas.toDataURL('image/jpeg', 0.8)}"></div>
        <div class="pcard-info">
          <div class="pcard-title-row">
            <div class="pcard-title" id="stripName_${i}">${escapeHtml(img.name)}</div>
            <div class="pcard-note">#${i + 1}</div>
          </div>
          <div class="pcard-note" id="stripNote_${i}">#${i + 1} · P${region.page || '-'} · ${region.scale || 100}%</div>
        </div>
        <div class="adj-box" onclick="event.stopPropagation()">
          <div class="control-head"><b>角度</b><span id="degLabel_${i}">旋轉: ${region.angle || 0}°</span></div>
          <div class="btn-group">
            <button class="rbtn" onclick="updateRot(${i},-1)">-1°</button>
            <button class="rbtn" onclick="updateRot(${i},1)">+1°</button>
          </div>
          <input id="rotSlider_${i}" type="range" min="-15" max="15" value="${region.angle || 0}" oninput="updateRot(${i}, parseInt(this.value), false, true)" style="width:100%">
          <div class="control-row">
            <span class="control-label">縮放</span>
            <input id="scaleSlider_${i}" type="range" min="50" max="200" step="5" value="${region.scale || 100}" oninput="updateScale(${i}, parseInt(this.value))">
            <span class="control-value" id="scaleLabel_${i}">${region.scale || 100}%</span>
          </div>
          <div class="btn-group"><button class="rbtn" onclick="updateScale(${i},100)">重置縮放</button></div>
          <input type="text" class="name-input" value="${escapeHtml(img.name)}" oninput="syncName(${i}, this.value)" placeholder="請輸入檔名">
        </div>`;
      g.appendChild(d);
    });
    document.getElementById('btnDL').disabled = false;
  }

  function setActiveResult(idx){
    activeResultIndex = Math.max(0, Math.min(finalImages.length - 1, idx));
    renderPrevList();
  }

  window.syncName = (idx, val) => {
    finalImages[idx].name = val;
    finalImages[idx].manualEdited = true;
    const stripTitle = document.getElementById(`stripName_${idx}`);
    if (stripTitle) stripTitle.textContent = val;
  };

  window.updateRot = (idx, val, reset=false, fromSlider=false) => {
    regions[idx].angle = Math.max(-15, Math.min(15, fromSlider ? val : regions[idx].angle + val));
    const ratio = isImageMode ? (pdfCache[regions[idx].page].width / pdfCanvas.width) : (6.0 / 1.5);
    renderSingleImage(idx, regions[idx].page, ratio);
    refreshResultPreview(idx);
  };

  window.updateScale = (idx, scale) => {
    regions[idx].scale = Math.max(50, Math.min(200, parseInt(scale) || 100));
    const ratio = isImageMode ? (pdfCache[regions[idx].page].width / pdfCanvas.width) : (6.0 / 1.5);
    renderSingleImage(idx, regions[idx].page, ratio);
    refreshResultPreview(idx);
  };

  function refreshResultPreview(idx){
    const preview = document.getElementById(`prevImg_${idx}`);
    const label = document.getElementById(`scaleLabel_${idx}`);
    const degLabel = document.getElementById(`degLabel_${idx}`);
    const stripNote = document.getElementById(`stripNote_${idx}`);
    const rotSlider = document.getElementById(`rotSlider_${idx}`);
    const scaleSlider = document.getElementById(`scaleSlider_${idx}`);
    if (preview) preview.src = finalImages[idx].canvas.toDataURL('image/jpeg', 0.8);
    if (label) label.textContent = `${regions[idx].scale}%`;
    if (degLabel) degLabel.textContent = `旋轉: ${regions[idx].angle}°`;
    if (stripNote) stripNote.textContent = `#${idx + 1} · P${regions[idx].page} · ${regions[idx].scale}%`;
    if (rotSlider) rotSlider.value = regions[idx].angle;
    if (scaleSlider) scaleSlider.value = regions[idx].scale;
  }

  function getDpiJpeg(canvas, dpi) {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.95), base64 = dataUrl.split(',')[1], raw = atob(base64), uint8 = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) uint8[i] = raw.charCodeAt(i);

    const dpiH = Math.floor(dpi / 256);
    const dpiL = dpi % 256;

    const jfif = new Uint8Array([0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0x00, 0x01, 0x01, 0x01, dpiH, dpiL, dpiH, dpiL, 0x00, 0x00]);
    let start = (uint8[2] === 0xFF && uint8[3] === 0xE0) ? 2 + (uint8[4] * 256 + uint8[5]) + 2 : 2;
    const finalBlob = new Uint8Array(2 + jfif.length + uint8.length - start);
    finalBlob.set([0xFF, 0xD8], 0); finalBlob.set(jfif, 2); finalBlob.set(uint8.slice(start), 2 + jfif.length); return finalBlob;
  }

  document.getElementById('btnDL').onclick=()=>{
    var zip=new JSZip();
    const usedZipNames = new Set();
    finalImages.forEach(img => {
      let safeName = (img.name || "未命名").replace(/[\\/:*?"<>|]/g,'');
      safeName = safeName.trim() || "未命名";
      const baseName = safeName;
      let seq = 2;
      while (usedZipNames.has(safeName)) safeName = `${baseName}_${seq++}`;
      usedZipNames.add(safeName);
      zip.file(safeName + ".jpg", getDpiJpeg(img.canvas, currentSelectedDpi));
    });
    zip.generateAsync({type:'blob'}).then(blob=>saveAs(blob, `學員照片_${currentSelectedDpi}dpi.zip`));
  };

  function getPos(e){ var r=overlayCanvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / currentZoom, y: (e.clientY - r.top) / currentZoom }; }
  document.getElementById('prevPg').onclick=()=>goPage(-1);
  document.getElementById('nextPg').onclick=()=>goPage(1);
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement ? document.activeElement.tagName : '';
    const isTyping = ['INPUT','TEXTAREA','SELECT'].includes(tag) || document.activeElement?.isContentEditable;
    if(isTyping || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if(e.key === 'ArrowLeft') { e.preventDefault(); goPage(-1); }
    if(e.key === 'ArrowRight') { e.preventDefault(); goPage(1); }
  });
  window.delRegion = (idx) => {
    regions.splice(idx, 1);
    finalImages.splice(idx, 1);
    updateUI(true);
  };
})();
</script>
</body>
</html>
